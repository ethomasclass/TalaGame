<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,600;9..144,1,400&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#1a1216;font-family:"Source Sans 3",sans-serif}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#1a1216}
  .art{position:absolute;inset:0} svg{display:block}

  /* ---------- movement beyond eyes ---------- */
  @keyframes blink{0%,91%{transform:scaleY(1)}94%{transform:scaleY(.06)}97%,100%{transform:scaleY(1)}}
  .blink{animation:blink 5s ease-in-out infinite}.blink.b{animation-delay:-1.7s;animation-duration:6.1s}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
  .breathe{animation:breathe 3.8s ease-in-out infinite}
  /* head nod : small rotation about the neck, once in a while */
  @keyframes nod{0%,70%,100%{transform:rotate(0) translateY(0)}76%{transform:rotate(1.6deg) translateY(4px)}82%{transform:rotate(-.6deg) translateY(1px)}88%{transform:rotate(1.2deg) translateY(3px)}}
  .nod{transform-origin:150px 300px;animation:nod 7s ease-in-out infinite}
  /* pour : the whole arm+pitcher group rotates about the shoulder; the stream fades in at the tilt */
  @keyframes pour{0%,20%{transform:rotate(0)}38%,62%{transform:rotate(-26deg)}80%,100%{transform:rotate(0)}}
  .pour{transform-origin:236px 372px;animation:pour 7s ease-in-out infinite}
  @keyframes stream{0%,34%{opacity:0}42%,58%{opacity:.85}66%,100%{opacity:0}}
  .stream{animation:stream 7s ease-in-out infinite}
  /* talking : two mouth states toggled in steps while a line is on screen */
  @keyframes talk{0%,100%{opacity:1}50%{opacity:0}}
  @keyframes talkB{0%,100%{opacity:0}50%{opacity:1}}
  .talk .m-a{animation:talk .28s steps(1,end) infinite}.talk .m-b{animation:talkB .28s steps(1,end) infinite}
  /* the customer leans back into the chair */
  @keyframes lean{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.8deg) translateY(2px)}}
  .lean{transform-origin:1010px 700px;animation:lean 5.2s ease-in-out infinite}
  /* Tala shifts her weight in the doorway */
  @keyframes sway{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(3px) rotate(.6deg)}}
  .sway{transform-origin:140px 700px;animation:sway 4.6s ease-in-out infinite}
  /* headlights cross the wall every so often */
  @keyframes sweep{0%,72%{transform:translateX(-420px);opacity:0}76%{opacity:.55}92%{transform:translateX(560px);opacity:.5}96%,100%{transform:translateX(560px);opacity:0}}
  .sweep{animation:sweep 11s linear infinite}
  /* snow past the window */
  @keyframes fall{0%{transform:translate(0,-20px)}100%{transform:translate(14px,300px)}}
  .flake{animation:fall 6s linear infinite}
  @keyframes flicker{0%,100%{opacity:.62}50%{opacity:.74}} .lamp{animation:flicker 2.2s ease-in-out infinite}

  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:20px 26px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,236,210,.66);text-shadow:0 1px 6px rgba(0,0,0,.6);z-index:5}
  .hud .date{color:#fff0d6}.hud .sub{color:rgba(255,236,210,.45);margin-left:12px}
  .marks{display:flex;gap:6px;align-items:center}.mk{width:9px;height:14px;border-radius:2px;border:1px solid rgba(255,236,210,.32)}.mk.on{background:#e0a23c;border-color:#e0a23c;box-shadow:0 0 9px rgba(224,162,60,.65)}
  .dlg{position:absolute;left:0;right:0;bottom:0;padding:0 44px 30px;z-index:7}
  .panel{background:rgba(244,238,222,.965);border-radius:12px;padding:16px 24px 14px;max-width:860px;box-shadow:0 2px 4px rgba(0,0,0,.35),0 26px 60px -22px rgba(0,0,0,.9)}
  .who{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#a1462f;margin-bottom:7px}
  .line{font-family:"Fraunces",Georgia,serif;font-size:22px;line-height:1.42;color:#262a1e;margin:0}.line em{font-style:italic;color:#54594a}
  .adv{display:flex;justify-content:flex-end;margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:#8d8873}.adv span{border:1px solid rgba(38,42,30,.22);border-radius:4px;padding:3px 7px;margin-left:6px}
  .vig{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 55% 48%,transparent 40%,rgba(12,6,10,.7) 100%)}
  .grain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.15;mix-blend-mode:overlay;filter:url(#grain)}
</style></head><body><div class="stage"><div class="art">

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5a3a36"/><stop offset="100%" stop-color="#2c1a1c"/></linearGradient>

    <radialGradient id="doorGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#ffd9a0" stop-opacity=".9"/><stop offset="100%" stop-color="#f0a85a" stop-opacity="0"/></radialGradient>

    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e9eef7" stop-opacity=".4"/><stop offset="100%" stop-color="#b9c6de" stop-opacity=".7"/></linearGradient>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="7" result="big"/><feDisplacementMap in="SourceGraphic" in2="big" scale="7" xChannelSelector="R" yChannelSelector="G" result="d1"/><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="19" result="fine"/><feDisplacementMap in="d1" in2="fine" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="roughFine" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="5" result="f"/><feDisplacementMap in="SourceGraphic" in2="f" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter><filter id="mid"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="11"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="winClip"><rect x="62" y="70" width="230" height="300" rx="6"/></clipPath>
    <clipPath id="wallClip"><rect x="0" y="0" width="1280" height="520"/></clipPath>
    <!-- ============ TALA : base head, straight on. Local space 280x340, face centre (140,170). ============ -->

    <!-- the polite smile : corners up, not much else -->

    <g id="tala-lower">
      <g filter="url(#rough)">
        <!-- tee continues to the hip -->
        <path d="M 22 400 L 258 400 L 252 470 L 28 470 Z" fill="url(#tee)"/>
        <!-- apron, kitchen -->
        <path d="M 62 330 C 70 318 92 314 112 314 L 168 314 C 188 314 210 318 218 330 L 226 560 C 226 572 212 578 140 578 C 68 578 54 572 54 560 Z" fill="#f1e5cc"/>
        <path d="M 112 314 L 100 292" stroke="#cdb99a" stroke-width="6" stroke-linecap="round"/><path d="M 168 314 L 180 292" stroke="#cdb99a" stroke-width="6" stroke-linecap="round"/>
        <path d="M 54 400 L 226 400" stroke="#cdb99a" stroke-width="5" opacity=".7"/>
        <path d="M 84 470 L 196 470 L 200 540 L 80 540 Z" fill="#e3d6bb"/>
        <!-- jeans -->
        <path d="M 70 560 L 130 560 L 126 690 L 78 690 Z" fill="#3b4a78"/><path d="M 150 560 L 210 560 L 202 690 L 154 690 Z" fill="#3b4a78"/>
