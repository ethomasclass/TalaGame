<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#2a1a16;font-family:"Source Sans 3",sans-serif}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#2a1a16}
  .art{position:absolute;inset:0} svg{display:block}

  @keyframes blink{0%,91%{transform:scaleY(1)}94%{transform:scaleY(.06)}97%,100%{transform:scaleY(1)}}
  .blink{animation:blink 5s ease-in-out infinite}
  .blink.b{animation-delay:-1.7s;animation-duration:6.1s}.blink.c{animation-delay:-3.4s;animation-duration:5.6s}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
  .breathe{animation:breathe 3.8s ease-in-out infinite}.breathe.b{animation-delay:-1.3s}.breathe.c{animation-delay:-2.6s}
  @keyframes flicker{0%,100%{opacity:.5}50%{opacity:.62}}
  .lamp{animation:flicker 2.4s ease-in-out infinite}

  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:20px 26px;
    font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.11em;text-transform:uppercase;
    color:rgba(255,236,210,.7);text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:5}
  .hud .date{color:#fff0d6}.hud .sub{color:rgba(255,236,210,.5);margin-left:12px}
  .marks{display:flex;gap:6px;align-items:center}
  .mk{width:9px;height:14px;border-radius:2px;border:1px solid rgba(255,236,210,.32)}
  .mk.on{background:#e0a23c;border-color:#e0a23c;box-shadow:0 0 9px rgba(224,162,60,.65)}

  .dlg{position:absolute;left:0;right:0;bottom:0;padding:0 44px 30px;z-index:5}
  .panel{background:rgba(244,238,222,.965);border-radius:12px;padding:16px 24px 14px;max-width:860px;
    box-shadow:0 2px 4px rgba(0,0,0,.35),0 26px 60px -22px rgba(0,0,0,.9)}
  .who{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#a1462f;margin-bottom:7px}
  .line{font-family:"Fraunces",Georgia,serif;font-size:22px;line-height:1.42;color:#262a1e;margin:0}
  .line em{font-style:italic;color:#54594a}
  .adv{display:flex;justify-content:flex-end;margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:#8d8873}
  .adv span{border:1px solid rgba(38,42,30,.22);border-radius:4px;padding:3px 7px;margin-left:6px}

  .vig{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 44%,transparent 42%,rgba(40,14,10,.55) 100%)}
  .grain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.14;mix-blend-mode:overlay;filter:url(#grain)}
</style></head><body>

  <!-- ===== room ===== -->

<div class="hud">
  <div><span class="date">December 22</span><span class="sub">Seventh morning &middot; After the call</span></div>
  <div class="marks"><i class="mk on"></i><i class="mk on"></i><i class="mk on"></i><i class="mk on"></i><i class="mk on"></i><i class="mk on"></i><i class="mk on"></i><i class="mk"></i><i class="mk"></i></div>

</div></body></html>
